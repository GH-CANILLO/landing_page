
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>747LIVE-Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="pw1rp" data-ll-name="Page Wrapper" class="page-wrapper">
      <div id="lg0ar" data-ll-name="Logo Area" class="logo-area">
        <img id="lg0im" src="https://imagedelivery.net/c_gViAg48Noh05UnSpa2Mw/cc20493d-58ef-43f6-2895-3fbd5fa66300/format=webp,w=325,h=227" alt="Brand Logo" class="logo-img">
      </div>
      <div id="cd1mn" data-ll-name="Signup Card" class="card">
        <div id="tb1rw" data-ll-name="Card Header" class="card-header">
          <span id="tb2tx" class="card-header-text">Sign Up</span>
        </div>
        <div id="fm1bd" data-ll-custom-form-keys="[&quot;email&quot;,&quot;phone_country&quot;,&quot;phone&quot;,&quot;fb_name&quot;]" data-ll-name="Sign Up Form" class="form-body">
          <div id="ig1em" data-ll-name="Email Group" class="input-group">
            <label id="lb1em" data-gjs-type="label" for="in1em" class="input-label">Email Address</label>
            <div id="iw1em" class="input-wrap">
              <img id="ic1em" src="https://icons.ll-assets.com/lucide/mail.svg?color=%236b7280" alt="Email Icon" width="20" height="20" class="input-icon">
              <input id="in1em" data-gjs-type="input" type="email" name="email" placeholder="Enter your email" autocomplete="email" class="input-field">
            </div>
            <span id="er1em" class="input-error">Please enter a valid email address</span>
          </div>
          <div id="ig2ph" data-ll-name="Phone Group" class="input-group">
            <label id="lb2ph" data-gjs-type="label" for="in2ph" class="input-label">Phone Number</label>
            <div id="pr1rw" class="phone-row">
              <div id="cs1wr" class="country-select-wrap">
                <span id="fl1em" class="flag-emoji">🇵🇭</span>
                <select id="sl1cc" name="phone_country" aria-label="Country Code" class="country-select">
                  <option id="iq1bx" value="+63" selected="true">+63</option>
                  <option id="izp9e" value="+1">+1</option>
                  <option id="i1tsc" value="+44">+44</option>
                  <option id="ibvrg" value="+61">+61</option>
                  <option id="iyyzs" value="+81">+81</option>
                  <option id="i07kd" value="+82">+82</option>
                  <option id="izx29" value="+86">+86</option>
                  <option id="ijvcn" value="+91">+91</option>
                  <option id="ib0m5" value="+65">+65</option>
                  <option id="il3xj" value="+60">+60</option>
                  <option id="ia7xq" value="+66">+66</option>
                  <option id="igt4a" value="+84">+84</option>
                  <option id="iygz2" value="+62">+62</option>
                  <option id="iqhiz" value="+49">+49</option>
                  <option id="itj2d" value="+33">+33</option>
                </select>
                <img id="ic2ar" src="https://icons.ll-assets.com/lucide/chevron-down.svg?color=%236b7280" alt="Arrow" width="14" height="14" class="select-arrow">
              </div>
              <div id="pw2ph" class="input-wrap phone-input-wrap">
                <img id="ic2ph" src="https://icons.ll-assets.com/lucide/phone.svg?color=%236b7280" alt="Phone Icon" width="20" height="20" class="input-icon">
                <input id="in2ph" data-gjs-type="input" type="tel" name="phone" placeholder="9XX XXX XXXX" autocomplete="tel" maxlength="10" class="input-field">
              </div>
            </div>
            <span id="er2ph" class="input-error">Phone must be 10 digits and start with 9</span>
          </div>
          <div id="ig3fb" data-ll-name="FB Name Group" class="input-group">
            <label id="lb3fb" data-gjs-type="label" for="in3fb" class="input-label">Facebook Name</label>
            <div id="iw3fb" class="input-wrap">
              <img id="ic3fb" src="https://icons.ll-assets.com/lucide/user.svg?color=%236b7280" alt="User Icon" width="20" height="20" class="input-icon">
              <input id="in3fb" data-gjs-type="input" type="text" name="fb_name" placeholder="Enter your Facebook name" class="input-field">
            </div>
          </div>
          <a id="bt1sb" href="#" role="button" data-ll-name="Submit Button" class="btn-submit">
            <span id="bt1tx">Sign Up</span>
          </a>
          <p id="tm1tx" class="terms-text">
            <span id="tm1sp">By signing up, you agree to our </span>
            <a id="tm1lk" href="#" class="terms-link">Terms of Service</a>

      </div>
    </div>
    <script id="ioe9b">
      (function() {
        const emailInput = document.getElementById('in1em');
        const phoneInput = document.getElementById('in2ph');
        const fbInput = document.getElementById('in3fb');
        const countrySelect = document.getElementById('sl1cc');
        const submitBtn = document.getElementById('bt1sb');
        const flagEmoji = document.getElementById('fl1em');

        const flagMap = {
          '+63': '🇵🇭',
          '+1': '🇺🇸',
          '+44': '🇬🇧',
          '+61': '🇦🇺',
          '+81': '🇯🇵',
          '+82': '🇰🇷',
          '+86': '🇨🇳',
          '+91': '🇮🇳',
          '+65': '🇸🇬',
          '+60': '🇲🇾',
          '+66': '🇹🇭',
          '+84': '🇻🇳',
          '+62': '🇮🇩',
          '+49': '🇩🇪',
          '+33': '🇫🇷'
        };

        countrySelect.addEventListener('change', function() {
          flagEmoji.textContent = flagMap[this.value] || '🏳️';
        });

        function checkFormValidity() {
          const emailVal = emailInput.value.trim();
          const phoneVal = phoneInput.value.trim();
          const fbVal = fbInput.value.trim();
          const isValid = emailVal.length > 0 && phoneVal.length > 0 && fbVal.length > 0;
          if (isValid) {
            submitBtn.classList.add('active');
          } else {
            submitBtn.classList.remove('active');
          }
        }

        emailInput.addEventListener('input', checkFormValidity);
        phoneInput.addEventListener('input', checkFormValidity);
        fbInput.addEventListener('input', checkFormValidity);

        submitBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (!submitBtn.classList.contains('active')) return;

          const payload = {
            email: emailInput.value.trim(),
            phone_country: countrySelect.value,
            phone: phoneInput.value.trim(),
            fb_name: fbInput.value.trim()
          };

          submitBtn.textContent = 'Submitting...';
          submitBtn.style.pointerEvents = 'none';

          document.dispatchEvent(new CustomEvent('ll-custom-form-submit', {
            detail: payload
          }));

          setTimeout(function() {
            submitBtn.textContent = '✓ Account Created!';
            submitBtn.style.background = '#009159';
          }, 2000);
        });

        // Tab switching visual feedback
        const loginTab = document.getElementById('tb1lg');
        const signupTab = document.getElementById('tb2sg');

        loginTab.addEventListener('click', function(e) {
          e.preventDefault();
          loginTab.style.background = 'var(--ll-color-primary)';
          loginTab.style.color = '#fff';
          signupTab.style.background = 'var(--ll-color-tab-inactive)';
          signupTab.style.color = 'var(--ll-color-text-primary)';
        });

        signupTab.addEventListener('click', function(e) {
          e.preventDefault();
          signupTab.style.background = 'var(--ll-color-primary)';
          signupTab.style.color = '#fff';
          loginTab.style.background = 'var(--ll-color-tab-inactive)';
          loginTab.style.color = 'var(--ll-color-text-primary)';
        });
      })();

    </script>
    <script id="ioe9b-2">
      (function() {
        const emailInput = document.getElementById('in1em');
        const phoneInput = document.getElementById('in2ph');
        const fbInput = document.getElementById('in3fb');
        const countrySelect = document.getElementById('sl1cc');
        const submitBtn = document.getElementById('bt1sb');
        const flagEmoji = document.getElementById('fl1em');
        const emailError = document.getElementById('er1em');
        const phoneError = document.getElementById('er2ph');

        const flagMap = {
          '+63': '🇵🇭', '+1': '🇺🇸', '+44': '🇬🇧', '+61': '🇦🇺',
          '+81': '🇯🇵', '+82': '🇰🇷', '+86': '🇨🇳', '+91': '🇮🇳',
          '+65': '🇸🇬', '+60': '🇲🇾', '+66': '🇹🇭', '+84': '🇻🇳',
          '+62': '🇮🇩', '+49': '🇩🇪', '+33': '🇫🇷'
        };

        countrySelect.addEventListener('change', function() {
          flagEmoji.textContent = flagMap[this.value] || '🏳️';
        });

        function isValidEmail(email) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
          return /^9\d{9}$/.test(phone);
        }

        function clearError(inputWrap, errorEl) {
          inputWrap.classList.remove('error');
          errorEl.style.display = 'none';
        }

        function showError(inputWrap, errorEl) {
          inputWrap.classList.add('error');
          errorEl.style.display = 'block';
        }

        emailInput.addEventListener('input', function() {
          var val = emailInput.value.trim();
          if (val.length > 0 && !isValidEmail(val)) {
            showError(document.getElementById('iw1em'), emailError);
          } else {
            clearError(document.getElementById('iw1em'), emailError);
          }
          checkFormValidity();
        });

        phoneInput.addEventListener('input', function() {
          this.value = this.value.replace(/\D/g, '');
          var val = phoneInput.value.trim();
          if (val.length > 0 && !isValidPhone(val)) {
            showError(document.getElementById('pw2ph'), phoneError);
          } else {
            clearError(document.getElementById('pw2ph'), phoneError);
          }
          checkFormValidity();
        });

        fbInput.addEventListener('input', checkFormValidity);

        function checkFormValidity() {
          var emailVal = emailInput.value.trim();
          var phoneVal = phoneInput.value.trim();
          var fbVal = fbInput.value.trim();
          var isValid = isValidEmail(emailVal) && isValidPhone(phoneVal) && fbVal.length > 0;
          if (isValid) {
            submitBtn.classList.add('active');
          } else {
            submitBtn.classList.remove('active');
          }
        }

        submitBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (!submitBtn.classList.contains('active')) return;

          var payload = {
            email: emailInput.value.trim(),
            phone_country: countrySelect.value,
            phone: phoneInput.value.trim(),
            fb_name: fbInput.value.trim()
          };

          submitBtn.textContent = 'Submitting...';
          submitBtn.style.pointerEvents = 'none';

          document.dispatchEvent(new CustomEvent('ll-custom-form-submit', {
            detail: payload
          }));

          setTimeout(function() {
            submitBtn.textContent = '✓ Account Created!';
            submitBtn.style.background = '#009159';
          }, 2000);
        });
      })();

    </script>
